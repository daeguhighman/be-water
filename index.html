<style>
:root{
  --ink:#f4efe4;
  --ink-shadow:rgba(0,0,0,.55);
  --curtain:#000;
  --brush:"Nanum Brush Script","Nanum Pen Script","Apple SD Gothic Neo",serif;
  color-scheme:dark;
}
body[data-ink="dark"]{--ink:#1b241f;--ink-shadow:rgba(255,255,255,.55)}
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding-top:calc(env(safe-area-inset-top,0px) + 18px);text-align:center;pointer-events:none;color:var(--ink);font-family:var(--brush);text-shadow:0 0 14px var(--ink-shadow)}
#hud b{font-weight:400;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
#hud .u{font-size:34px;margin-left:2px}
#hud .m{font-size:26px;opacity:.7;margin-left:6px}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px);width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.18);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
#snd:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#snd svg{width:22px;height:22px}
#grain{position:fixed;inset:-50%;pointer-events:none;opacity:.06;mix-blend-mode:overlay;animation:grain 1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-4%,3%)}40%{transform:translate(3%,-5%)}60%{transform:translate(-6%,-2%)}80%{transform:translate(5%,4%)}100%{transform:translate(0,0)}}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 75% at 50% 48%,transparent 55%,rgba(0,0,0,.42) 100%)}
#quote{position:fixed;left:0;right:0;bottom:0;padding:0 max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 54px) max(24px,env(safe-area-inset-left,0px));text-align:center;pointer-events:none;color:var(--ink);font-family:var(--brush);font-size:clamp(27px,7.4vw,40px);line-height:1.25;text-shadow:0 0 16px var(--ink-shadow);text-wrap:balance;word-break:keep-all;opacity:0;transform:translateY(8px);transition:opacity .9s ease,transform .9s ease}
#quote.on{opacity:1;transform:none}
#curtain{position:fixed;inset:0;z-index:10;background:var(--curtain);color:#f4efe4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 max(28px,env(safe-area-inset-right,0px)) 0 max(28px,env(safe-area-inset-left,0px));text-align:center;font-family:var(--brush);opacity:1;transition:opacity 1.6s ease;pointer-events:none}
#curtain.off{opacity:0}
#curtain p{margin:0;opacity:0;transition:opacity 1.2s ease;word-break:keep-all;text-wrap:balance}
#curtain.text p{opacity:1}
#cStage{font-size:26px;letter-spacing:.2em;opacity:.6}
#curtain.text #cStage{opacity:.6}
#cLine{font-size:clamp(32px,8.6vw,48px);line-height:1.3}
@media (prefers-reduced-motion:reduce){#grain{animation:none}#quote,#curtain,#curtain p{transition-duration:.01s}}
/* 가로 화면 기준 배치 */
#hud{padding-top:calc(env(safe-area-inset-top,0px) + 10px)}
#hud b{font-size:46px}
#hud .u{font-size:26px}
#hud .m{font-size:20px}
#quote{max-width:72vw;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-size:clamp(22px,6.6vh,34px)}
#cLine{font-size:clamp(28px,8.5vh,46px)}
#cStage{font-size:clamp(18px,5vh,26px)}
/* 조작 버튼: 왼쪽 아래 이동, 오른쪽 아래 동작 */
.ctl{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:grid;gap:10px;z-index:5;transition:opacity 1.2s ease}
#pad{left:calc(env(safe-area-inset-left,0px) + 14px);grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:2px}
#pad .u{grid-area:1/2}#pad .l{grid-area:2/1}#pad .r{grid-area:2/3}#pad .d{grid-area:3/2}
.ctl button{height:48px;border:1px solid rgba(244,239,228,.28);border-radius:24px;background:rgba(0,0,0,.28);color:var(--ink);font-family:var(--brush);font-size:23px;line-height:1;padding:0;display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);touch-action:none;transition:background .15s ease,transform .15s ease}
#pad button{width:46px;height:46px;border-radius:50%}
.ctl button svg{width:24px;height:24px}
/* 오른쪽 아래: 주먹·발차기를 게임패드처럼 비스듬히, 그 위 작은 버튼이 기술 판을 펼침 */
#acts{right:calc(env(safe-area-inset-right,0px) + 16px);width:150px;height:150px;display:block}
#acts .big{position:absolute;inset:0}
#acts .big button{position:absolute;border-radius:50%}
#acts [data-k="kick"]{right:0;bottom:0;width:70px;height:70px}
#acts [data-k="punch"]{right:78px;bottom:26px;width:60px;height:60px}
#acts .more{right:18px;bottom:84px;width:40px;height:40px;opacity:.85}
#acts [data-k="kick"] svg{width:32px;height:32px}
#acts [data-k="punch"] svg{width:28px;height:28px}
#acts .more svg{width:18px;height:18px}
#acts .more[aria-expanded="true"]{background:rgba(244,239,228,.22);border-color:rgba(244,239,228,.6)}
/* 기술 판: 접혀 있다가 위로 펼쳐짐 */
.tray{position:absolute;right:0;bottom:136px;display:grid;grid-template-columns:repeat(4,44px);gap:8px;padding:10px;border-radius:22px;background:rgba(10,10,10,.42);border:1px solid rgba(244,239,228,.16);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transform-origin:90% 100%;transform:scale(.6) translateY(16px);opacity:0;pointer-events:none;transition:transform .22s cubic-bezier(.2,.8,.3,1.2),opacity .18s ease}
.tray.open{transform:none;opacity:1;pointer-events:auto}
.tray button{width:44px;height:44px;border-radius:50%}
.tray svg{width:21px;height:21px}
.ctl button.down{background:rgba(244,239,228,.22);transform:scale(.94)}
.ctl button[aria-pressed="true"]{background:rgba(244,239,228,.2);border-color:rgba(244,239,228,.6)}
.ctl button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#quote{max-width:56vw}
/* 명상: 화면이 고요해짐 */
#veil{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 65% at 50% 55%,transparent 30%,rgba(0,0,0,.7) 100%);opacity:calc(var(--charge,0) * .9);transition:opacity .2s linear}
body.calm #veil{opacity:1;transition:opacity 2.4s ease}
body.calm #hud,body.calm #quote{opacity:.18!important;transition:opacity 2.4s ease}
#hud{transition:opacity 1.2s ease}
/* 워크맨: 왼쪽 위. 켜지면 테이프가 돌고 곡 제목이 보임 */
#walkman{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 14px);display:flex;align-items:center;gap:8px;padding:0;border:0;background:none;color:var(--ink);cursor:pointer;font-family:var(--brush);font-size:18px;z-index:5;opacity:.85}
#walkman svg{width:56px;height:38px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
#walkman .reel{transition:none}
#walkman.on .reel{animation:reel 1.4s linear infinite}
@keyframes reel{to{transform:rotate(360deg)}}
#walkman .song{max-width:34vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 10px var(--ink-shadow)}
#walkman:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
/* 시작 화면: 카세트를 워크맨에 넣으면 시작 */
#intro{position:fixed;inset:0;z-index:12;background:#050505;color:#f4efe4;font-family:var(--brush);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:opacity 1s ease;-webkit-tap-highlight-color:transparent}
#intro.off{opacity:0;pointer-events:none}
#intro p{margin:0;text-align:center}
#intro .it{font-size:clamp(34px,10vh,56px);line-height:1}
#intro .id{font-size:clamp(18px,5vh,26px);opacity:.6}
#intro .ih{font-size:clamp(16px,4.6vh,22px);opacity:.55;animation:blink 2.4s ease-in-out infinite}
#intro.in .ih{animation:none;opacity:0}
@keyframes blink{50%{opacity:.15}}
#intro .deck{position:relative;width:clamp(150px,36vh,200px);height:clamp(150px,36vh,200px);margin:6px 0}
#intro .player{position:absolute;left:0;right:0;bottom:0;width:100%}
#intro .tape{position:absolute;left:12%;width:76%;top:0;transform:translateY(-18%) rotate(-4deg);transition:transform .55s cubic-bezier(.5,0,.7,1),opacity .2s ease .5s;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
#intro.in .tape{transform:translateY(62%) rotate(0);opacity:0}
#intro.play .reel{animation:reel 1.2s linear infinite}
#rotate{position:fixed;inset:0;display:none;z-index:20;background:#000;color:#f4efe4;font-family:var(--brush);font-size:34px;align-items:center;justify-content:center;text-align:center;padding:0 24px}
@media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
